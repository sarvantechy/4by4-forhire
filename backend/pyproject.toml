[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fourbyfour-forhire-api"
version = "0.1.0"
description = "4by4 For Hire customer-to-customer rental marketplace API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25.1,<26",
    "boto3>=1.40,<2",
    "email-validator>=2.2,<3",
    "fastapi>=0.116,<1",
    "geoalchemy2>=0.18,<1",
    "PyJWT>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "redis>=6.4,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
